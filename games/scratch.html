<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Скретч-карта — CRUMB & CREMA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  body{display:flex;flex-direction:column;min-height:100%;padding-bottom:calc(24px + var(--safe-b))}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px 16px}
  /* a ticket with punched notches on the sides */
  .ticket{position:relative;width:min(90vw,380px);background:var(--ink);border-radius:26px;padding:18px;color:var(--bg);
    -webkit-mask:radial-gradient(circle 14px at 0 62%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 62%,transparent 98%,#000) right/51% 100% no-repeat;
            mask:radial-gradient(circle 14px at 0 62%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 62%,transparent 98%,#000) right/51% 100% no-repeat;
    box-shadow:0 30px 60px -30px rgba(43,29,20,.6)}
  .t-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.75;padding:2px 4px 14px}
  .t-head b{font-family:var(--display);font-weight:600;font-size:13px;opacity:1}
  .t-head b i{font-style:normal;color:var(--accent-2)}
  .area{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--surface)}
  .prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-align:center;padding:16px}
  .prize .e{line-height:0}
  .prize b{font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:-.02em}
  .prize small{color:var(--muted)}
  .prize.pop .e{animation:pop .7s var(--ease)}
  @keyframes pop{0%{transform:scale(.3) rotate(-25deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:none}}
  #coat{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .7s var(--ease)}
  #coat.gone{opacity:0;pointer-events:none}
  .finger{position:absolute;left:30%;top:58%;width:34px;height:34px;border-radius:50%;background:rgba(255,250,242,.85);border:3px solid #2b1d14;box-shadow:0 0 0 8px rgba(255,250,242,.35);pointer-events:none;animation:swipe 1.6s ease-in-out infinite}
  @keyframes swipe{0%,100%{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(120px,-20px) rotate(10deg)}}
  .t-foot{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 2px;font-size:12px;opacity:.75;border-top:2px dashed rgba(246,240,230,.25);margin-top:18px}
  .bar{width:min(90vw,380px);height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width .3s var(--ease)}
  .hint{font-size:13px;color:var(--muted)}
  .locked{position:absolute;inset:0;background:rgba(43,29,20,.85);display:grid;place-items:center;text-align:center;color:var(--bg);padding:20px;font-weight:600;z-index:3}
</style>
</head>
<body>
  <div class="g-top"><a class="g-back" href="index.html">← Игры</a><span class="g-logo">Crumb <i>&amp;</i> Crema</span><span class="g-badge">1 карта в день</span></div>
  <h1 class="g-title">Скретч-<span>карта</span></h1>
  <p class="g-sub">Сотрите защитный слой пальцем</p>

  <div class="stage">
    <div class="ticket">
      <div class="t-head"><b>Crumb <i>&amp;</i> Crema</b><span>Лотерея гостя</span></div>
      <div class="area" id="area">
        <div class="prize" id="prize"><span class="e" id="pE"></span><b id="pT"></b><small id="pS"></small></div>
        <canvas id="coat"></canvas>
        <span class="finger" id="finger"></span>
      </div>
      <div class="t-foot"><span id="ticketNo"></span><span>Действует 7 дней</span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <span class="hint" id="hint">Сотрите больше половины, чтобы открыть приз</span>
  </div>

<script src="common.js"></script>
<script>
(() => {
  GAME.setupBack(true);
  const PRIZES = [
    { e: 'percent', t: 'Скидка 10%', p: 'Скидка 10% на заказ', w: 30 },
    { e: 'croissant', t: 'Круассан', p: 'Круассан в подарок', w: 15 },
    { e: 'cup', t: 'Капучино', p: 'Капучино в подарок', w: 8 },
    { e: 'percent', t: 'Скидка 20%', p: 'Скидка 20% на заказ', w: 5 },
    { e: 'swirl', t: 'Синнабон', p: 'Синнабон в подарок', w: 7 },
    { e: 'percent', t: 'Скидка 5%', p: 'Скидка 5% на заказ', w: 10 },
    { e: 'moon', t: 'Повезёт завтра', lose: true, w: 25 }
  ];
  const area = document.getElementById('area'), canvas = document.getElementById('coat'), ctx = canvas.getContext('2d');
  const bar = document.getElementById('bar'), finger = document.getElementById('finger');
  let prize, revealed, scratching, last, moves, lastBuzz;

  function paintCoat() {
    const r = area.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = r.width * dpr; canvas.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    // brushed-metal coating in the cafe's warm tones
    const g = ctx.createLinearGradient(0, 0, r.width, r.height);
    g.addColorStop(0, '#b9aa99'); g.addColorStop(.35, '#ece3d7'); g.addColorStop(.5, '#c9bba9'); g.addColorStop(.75, '#efe6db'); g.addColorStop(1, '#b3a391');
    ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
    for (let y = 0; y < r.height; y += 3) { ctx.fillStyle = `rgba(255,255,255,${Math.random() * .08})`; ctx.fillRect(0, y, r.width, 1); }
    ctx.save();
    ctx.translate(r.width / 2, r.height / 2); ctx.rotate(-.35);
    ctx.font = '700 15px Manrope, sans-serif'; ctx.fillStyle = 'rgba(91,76,63,.35)'; ctx.textAlign = 'center';
    for (let y = -r.height; y < r.height; y += 34) for (let x = -r.width; x < r.width; x += 120) ctx.fillText('СОТРИ', x + (y / 34 % 2 ? 60 : 0), y);
    ctx.restore();
    ctx.font = '600 22px Unbounded, sans-serif'; ctx.fillStyle = '#5b4c3f'; ctx.textAlign = 'center';
    ctx.fillText('Сотри меня', r.width / 2, r.height / 2 + 8);
  }

  function newTicket() {
    prize = GAME.pick(PRIZES);
    revealed = false; scratching = false; moves = 0; lastBuzz = 0;
    document.getElementById('pE').innerHTML = GAME.art(prize.e, 84);
    document.getElementById('pT').textContent = prize.t;
    document.getElementById('pS').textContent = prize.lose ? 'Сегодня без подарка' : 'Ваш подарок!';
    document.getElementById('prize').classList.remove('pop');
    document.getElementById('ticketNo').textContent = '№ ' + String(Math.floor(Math.random() * 900000) + 100000);
    canvas.classList.remove('gone');
    finger.style.display = '';
    bar.style.width = '0';
    paintCoat();
  }

  const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function scratch(e) {
    const [x, y] = pos(e);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 46; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...(last || [x, y])); ctx.lineTo(x, y); ctx.stroke();
    last = [x, y];
    const now = performance.now();
    if (now - lastBuzz > 90) { GAME.haptic('i', 'soft'); lastBuzz = now; }
    if (++moves % 6 === 0) check();
  }
  // estimate how much is cleared by sampling the alpha channel on a coarse grid
  function check() {
    const { width: w, height: h } = canvas, data = ctx.getImageData(0, 0, w, h).data;
    let clear = 0, total = 0;
    for (let i = 3; i < data.length; i += 4 * 24) { total++; if (data[i] < 40) clear++; }
    const pct = clear / total;
    bar.style.width = Math.min(100, pct / .55 * 100) + '%';
    if (pct > .55 && !revealed) reveal();
  }
  function reveal() {
    revealed = true;
    canvas.classList.add('gone');
    document.getElementById('prize').classList.add('pop');
    bar.style.width = '100%';
    const again = () => newTicket();
    setTimeout(() => {
      if (prize.lose) GAME.showResult({ game: 'scratch', win: false, icon: 'moon', title: 'Повезёт завтра', text: 'На этой карте пусто. Новая карта будет ждать вас завтра.', onAgain: GAME.tg ? null : again });
      else GAME.showResult({ game: 'scratch', win: true, prize: prize.p, icon: prize.e, text: prize.p, onAgain: again });
    }, 900);
  }

  canvas.addEventListener('pointerdown', e => { if (revealed) return; scratching = true; last = null; finger.style.display = 'none'; canvas.setPointerCapture(e.pointerId); scratch(e); });
  canvas.addEventListener('pointermove', e => scratching && scratch(e));
  ['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, () => { scratching = false; last = null; if (!revealed) check(); }));
  addEventListener('resize', () => { if (!revealed && !moves) paintCoat(); });

  newTicket();
  document.fonts && document.fonts.ready.then(() => { if (!moves) paintCoat(); });
  if (GAME.playedToday('scratch')) area.insertAdjacentHTML('beforeend', '<div class="locked">Сегодняшняя карта уже открыта.<br>Новая будет завтра.</div>');
})();
</script>
</body>
</html>
